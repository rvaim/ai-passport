name: Verify, release, and deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Repository and host checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Resolve locked ESP-IDF components
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: >-
            idf.py
            -B build/static-deps
            -D SDKCONFIG=/app/${{ github.repository }}/build/static-deps/sdkconfig
            reconfigure

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Validate repository and run host tests
        run: ./tools/validate.sh --static

  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and verify merged firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Upload verified firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish firmware Release
    needs:
      - static
      - firmware
    if: >-
      github.event_name != 'pull_request' &&
      needs.static.result == 'success' &&
      needs.firmware.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download verified firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-${{ github.run_id }}
          path: ${{ runner.temp }}/firmware

      - name: Prepare release tag and firmware assets
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag=latest
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          cp "$RUNNER_TEMP/firmware/FoloToy-AI-Passport-full.bin" "$release_dir/"
          sha256sum "$release_dir/FoloToy-AI-Passport-full.bin" > "$release_dir/SHA256SUMS"

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-assets"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            release_command=(gh release edit "$RELEASE_TAG" \
              --title "${RELEASE_TAG} · AI Passport" \
              --notes "Automated build for ${GITHUB_SHA}.")
          else
            release_command=(gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "${RELEASE_TAG} · AI Passport" \
              --notes "Automated build for ${GITHUB_SHA}.")
          fi
          if [ "$RELEASE_TAG" = latest ]; then
            release_command+=(--prerelease)
          fi
          "${release_command[@]}"
          gh release upload "$RELEASE_TAG" "$release_dir"/* --clobber

  pages:
    name: Configure and upload Pages artifact
    needs:
      - static
      - firmware
    if: >-
      github.event_name != 'pull_request' &&
      needs.static.result == 'success' &&
      needs.firmware.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build GitHub Pages installer
        run: node site/build.mjs --output "$RUNNER_TEMP/site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: pages
    if: needs.pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
