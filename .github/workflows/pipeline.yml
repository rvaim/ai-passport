name: Verify, publish, and deploy

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: passport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and pack PAPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pack repository PAPs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/pap-publish"
          mkdir -p "$publish_dir/packages" "$publish_dir/repo"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            mode=--check
          else
            mode=--write
          fi
          python3 tools/build_pap_catalog.py "$mode" \
            --prune \
            --catalog "$publish_dir/catalog.json" \
            --packages-dir "$publish_dir/packages"
          while IFS= read -r package; do
            destination="$publish_dir/repo/$package"
            mkdir -p "$(dirname "$destination")"
            cp "$package" "$destination"
          done < <(find examples -type f -path '*/dist/*.pap' -print | sort)

      - name: Upload generated PAPs and catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pap-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/pap-publish
          if-no-files-found: error
          retention-days: 7

  static:
    name: Repository and host checks
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Apply generated PAPs for validation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pap-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/pap-publish

      - name: Restore generated PAP paths
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/pap-publish/repo"
          while IFS= read -r tracked; do
            if [ ! -f "$artifact_root/$tracked" ]; then
              rm -f "$tracked"
            fi
          done < <(git ls-files 'examples/**/dist/*.pap')
          if [ -d "$RUNNER_TEMP/pap-publish/repo/examples" ]; then
            cp -R "$artifact_root/examples/." examples/
          fi

      - name: Validate repository and run host tests
        run: ./tools/validate.sh --static

  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and verify merged firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Upload verified firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7

  commit-dist:
    name: Commit generated PAPs
    needs:
      - package
      - static
      - firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Download generated PAPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pap-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/pap-publish

      - name: Sync generated dist files
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/pap-publish/repo"
          while IFS= read -r tracked; do
            if [ ! -f "$artifact_root/$tracked" ]; then
              rm -f "$tracked"
            fi
          done < <(git ls-files 'examples/**/dist/*.pap')
          if [ -d "$artifact_root/examples" ]; then
            while IFS= read -r package; do
              destination="${package#"$artifact_root/"}"
              mkdir -p "$(dirname "$destination")"
              cp "$package" "$destination"
            done < <(find "$artifact_root/examples" -type f -path '*/dist/*.pap' -print | sort)
          fi

      - name: Commit and push generated PAPs
        run: |
          set -euo pipefail
          if git diff --quiet -- ':(glob)examples/**/dist/*.pap'; then
            echo "PAP outputs are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- ':(glob)examples/**/dist/*.pap'
          git diff --cached --check
          git commit -m "chore(artifacts): refresh PAP packages"
          git push origin HEAD:main

  publish:
    name: Publish Release and Pages artifact
    needs:
      - package
      - static
      - firmware
      - commit-dist
    if: >-
      github.event_name != 'pull_request' &&
      needs.package.result == 'success' &&
      needs.static.result == 'success' &&
      needs.firmware.result == 'success' &&
      (needs['commit-dist'].result == 'success' || needs['commit-dist'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download PAPs and firmware
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: firmware-${{ github.run_id }}
          path: ${{ runner.temp }}/firmware

      - name: Download PAP catalog
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pap-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/pap-publish

      - name: Prepare release tag and assets
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag=latest
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          release_dir="$RUNNER_TEMP/release-assets"
          mkdir -p "$release_dir"
          cp "$RUNNER_TEMP/firmware/FoloToy-AI-Passport-full.bin" "$release_dir/"
          cp "$RUNNER_TEMP/pap-publish/packages/"*.pap "$release_dir/"
          cp "$RUNNER_TEMP/pap-publish/catalog.json" "$release_dir/catalog.json"
          sha256sum "$release_dir"/* > "$release_dir/SHA256SUMS"

      - name: Install site dependencies
        run: npm ci --prefix site --ignore-scripts --no-audit --no-fund

      - name: Build GitHub Pages site
        run: |
          node site/build.mjs \
            --output "$RUNNER_TEMP/site" \
            --catalog "$RUNNER_TEMP/pap-publish/catalog.json" \
            --packages "$RUNNER_TEMP/pap-publish/packages" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_SHA" \
            --release-tag "$RELEASE_TAG"

      - name: Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/release-assets"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              [ -n "$asset" ] && gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            release_command=(gh release edit "$RELEASE_TAG" \
              --title "${RELEASE_TAG} · AI Passport" \
              --notes "Automated build for ${GITHUB_SHA}.")
          else
            release_command=(gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "${RELEASE_TAG} · AI Passport" \
              --notes "Automated build for ${GITHUB_SHA}.")
          fi
          if [ "$RELEASE_TAG" = latest ]; then
            release_command+=(--prerelease)
          fi
          "${release_command[@]}"
          gh release upload "$RELEASE_TAG" "$release_dir"/* --clobber

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/site

  deploy-pages:
    name: Deploy GitHub Pages
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
