<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Passport 插件安装</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #17202a;
      background: #d9edf5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 16px; }
    main { width: min(100%, 560px); margin: 0 auto; }
    header { display: flex; gap: 14px; align-items: center; margin-bottom: 24px; }
    header svg { width: 44px; height: 44px; padding: 9px; color: white; background: #0872c9; border-radius: 14px; }
    h1 { margin: 0; font-size: clamp(25px, 6vw, 34px); letter-spacing: -.03em; }
    header p { margin: 4px 0 0; color: #44545f; }
    section { background: #f8faf8; border: 2px solid #17202a; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 8px 18px rgba(23,32,42,.12); }
    h2 { margin: 0 0 14px; font-size: 18px; }
    label { display: block; margin: 0 0 7px; font-weight: 700; }
    input[type=text], input[type=file] {
      width: 100%; min-height: 48px; border: 2px solid #6f8089; border-radius: 12px;
      background: white; padding: 10px 12px; font: inherit;
    }
    input[type=text] { font-size: 22px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    input:focus-visible, button:focus-visible { outline: 4px solid rgba(22,137,232,.28); outline-offset: 2px; }
    button {
      width: 100%; min-height: 50px; margin-top: 14px; border: 0; border-radius: 12px;
      background: #0872c9; color: white; font: 700 16px/1.2 inherit; cursor: pointer;
    }
    button:hover { background: #075fa7; }
    button:disabled { cursor: not-allowed; background: #9aa8ae; color: #edf1f2; }
    .status { display: flex; gap: 10px; align-items: flex-start; }
    .dot { width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; background: #7b898f; flex: 0 0 auto; }
    .status[data-kind=working] .dot { background: #1689e8; }
    .status[data-kind=success] .dot { background: #55951d; }
    .status[data-kind=error] .dot { background: #c72f27; }
    .status strong { display: block; margin-bottom: 4px; }
    .status p { margin: 0; color: #44545f; line-height: 1.45; }
    progress { width: 100%; height: 12px; margin-top: 15px; accent-color: #1689e8; }
    .note { color: #52636c; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <header>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.5 2 18 7.5 14 12l4 4.5-5.5 5.5V14l-4.1 4.1L7 16.7l4.7-4.7L7 7.3l1.4-1.4 4.1 4.1V2Zm2 4.8v3.4l1.7-1.7-1.7-1.7Zm0 7v3.4l1.7-1.7-1.7-1.7Z"/></svg>
      <div><h1>Passport 插件安装</h1><p>Chrome 通过蓝牙直接连接设备，不经过互联网。</p></div>
    </header>

    <section>
      <h2>1. 同步设备</h2>
      <label for="device-code">设备屏幕上的设备码</label>
      <input id="device-code" type="text" inputmode="text" autocomplete="off"
             maxlength="11" placeholder="00000-00000" aria-describedby="code-help">
      <p id="code-help" class="note">在设备首页打开“插件”，即可看到固定设备码。</p>
      <button id="connect" type="button">同步附近的 Passport</button>
    </section>

    <section>
      <h2>2. 安装插件</h2>
      <label for="plugin-file">已签名的 .fpp 文件</label>
      <input id="plugin-file" type="file" accept=".fpp,application/octet-stream" disabled>
      <button id="install" type="button" disabled>发送到设备</button>
      <progress id="progress" value="0" max="1" hidden></progress>
    </section>

    <section class="status" id="status" data-kind="idle" aria-live="polite">
      <span class="dot"></span>
      <div><strong id="status-title">尚未连接</strong><p id="status-detail">先在设备上打开“插件”，再输入设备码。</p></div>
    </section>
    <p class="note">首次使用时 Chrome 会强制显示设备授权列表；同一网站再次使用会优先自动连接已授权设备。网页必须通过 HTTPS 或 localhost 打开。插件传输完成后仍需在设备上按 OK 确认安装。</p>
  </main>

  <script>
    const SERVICE = 'f0771000-6f6c-6f74-6f79-70617373706f';
    const CONTROL = 'f0771001-6f6c-6f74-6f79-70617373706f';
    const DATA = 'f0771002-6f6c-6f74-6f79-70617373706f';
    const STATUS = 'f0771003-6f6c-6f74-6f79-70617373706f';
    const stateNames = ['空闲', '接收中', '验签中', '等待设备确认', '安装中', '安装完成', '安装失败'];
    const codeInput = document.querySelector('#device-code');
    const fileInput = document.querySelector('#plugin-file');
    const connectButton = document.querySelector('#connect');
    const installButton = document.querySelector('#install');
    const progress = document.querySelector('#progress');
    const statusBox = document.querySelector('#status');
    const statusTitle = document.querySelector('#status-title');
    const statusDetail = document.querySelector('#status-detail');
    let device;
    let controlCharacteristic;
    let dataCharacteristic;
    let statusCharacteristic;
    let synchronized = false;
    let chooserRequired = false;

    function showStatus(kind, title, detail) {
      statusBox.dataset.kind = kind;
      statusTitle.textContent = title;
      statusDetail.textContent = detail;
    }

    function compactCode() {
      const value = codeInput.value.toUpperCase().replace(/[-\s]/g, '');
      if (!/^[0-9A-HJKMNP-TV-Z]{10}$/.test(value)) throw new Error('设备码应为屏幕显示的 10 个字符');
      return value;
    }

    codeInput.addEventListener('input', () => {
      const raw = codeInput.value.toUpperCase().replace(/[^0-9A-HJKMNP-TV-Z]/g, '').slice(0, 10);
      codeInput.value = raw.length > 5 ? `${raw.slice(0, 5)}-${raw.slice(5)}` : raw;
    });

    function parseStatus(value) {
      const view = value instanceof DataView ? value : new DataView(value.buffer, value.byteOffset, value.byteLength);
      if (view.byteLength !== 20 || view.getUint8(0) !== 2) throw new Error('设备安装协议版本不匹配');
      return {
        state: view.getUint8(1), sync: view.getUint8(2), error: view.getInt32(4, true),
        expected: view.getUint32(8, true), received: view.getUint32(12, true),
        pluginVersion: view.getUint32(16, true),
      };
    }

    async function readStatus(characteristic = statusCharacteristic) {
      return parseStatus(await characteristic.readValue());
    }
    const delay = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function writeWithResponse(characteristic, value) {
      if (characteristic.writeValueWithResponse) return characteristic.writeValueWithResponse(value);
      return characteristic.writeValue(value);
    }

    function littleEndian(value) {
      const bytes = new Uint8Array(4);
      new DataView(bytes.buffer).setUint32(0, value, true);
      return bytes;
    }

    async function waitFor(predicate, timeout, label, characteristic = statusCharacteristic) {
      const deadline = performance.now() + timeout;
      while (performance.now() < deadline) {
        const current = await readStatus(characteristic);
        if (current.state === 6) throw new Error(`设备拒绝操作（ESP 错误 ${current.error}）`);
        if (predicate(current)) return current;
        await delay(40);
      }
      throw new Error(`${label}超时`);
    }

    function onDisconnected() {
      synchronized = false;
      fileInput.disabled = true;
      installButton.disabled = true;
      connectButton.disabled = false;
      connectButton.textContent = '同步附近的 Passport';
      chooserRequired = false;
      showStatus('idle', '连接已断开', '重新打开“插件”后再次连接。');
    }

    async function synchronizeConnectedCandidate(candidate, code) {
      const server = await candidate.gatt.connect();
      const service = await server.getPrimaryService(SERVICE);
      const [candidateControl, candidateData, candidateStatus] = await Promise.all([
        service.getCharacteristic(CONTROL), service.getCharacteristic(DATA),
        service.getCharacteristic(STATUS),
      ]);
      const auth = new Uint8Array(11);
      auth[0] = 0x10;
      auth.set(new TextEncoder().encode(code), 1);
      await writeWithResponse(candidateControl, auth);
      const current = await waitFor(
        value => value.sync === 2 || value.sync === 3,
        5000, '设备同步', candidateStatus
      );
      if (current.sync !== 2) throw new Error('设备码与当前连接的设备不匹配');

      device = candidate;
      controlCharacteristic = candidateControl;
      dataCharacteristic = candidateData;
      statusCharacteristic = candidateStatus;
      device.addEventListener('gattserverdisconnected', onDisconnected);
      await statusCharacteristic.startNotifications();
      statusCharacteristic.addEventListener('characteristicvaluechanged', event => {
        const status = parseStatus(event.target.value);
        if (status.state === 5) {
          installButton.disabled = !synchronized;
          showStatus('success', '插件安装完成', '长按设备 OK 返回首页即可看到插件。');
        }
        if (status.state === 6) {
          installButton.disabled = !synchronized;
          showStatus('error', '设备拒绝安装', `ESP 错误 ${status.error}`);
        }
      });
    }

    async function synchronizeCandidate(candidate, code) {
      try {
        await synchronizeConnectedCandidate(candidate, code);
      } catch (error) {
        if (candidate.gatt.connected) candidate.gatt.disconnect();
        throw error;
      }
    }

    async function tryGrantedDevices(code) {
      if (typeof navigator.bluetooth.getDevices !== 'function') return { found: false, count: 0 };
      const granted = await navigator.bluetooth.getDevices();
      for (const candidate of granted) {
        try {
          showStatus('working', '正在自动同步', `尝试 ${candidate.name || '已授权 Passport'}…`);
          await synchronizeCandidate(candidate, code);
          return { found: true, count: granted.length };
        } catch (error) {
          if (candidate.gatt.connected) candidate.gatt.disconnect();
        }
      }
      return { found: false, count: granted.length };
    }

    connectButton.addEventListener('click', async () => {
      try {
        if (!navigator.bluetooth) throw new Error('当前浏览器不支持 Web Bluetooth，请使用 Chrome');
        const code = compactCode();
        connectButton.disabled = true;
        if (!chooserRequired) {
          showStatus('working', '正在查找已授权设备', '无需重新选择时会直接完成同步。');
          const granted = await tryGrantedDevices(code);
          if (granted.found) {
            chooserRequired = false;
          } else if (granted.count > 0) {
            chooserRequired = true;
            connectButton.disabled = false;
            connectButton.textContent = '选择其他 Passport';
            showStatus('idle', '未找到匹配的已授权设备', '确认设备已打开“插件”，然后点一次“选择其他 Passport”。');
            return;
          } else {
            showStatus('working', '首次授权设备', 'Chrome 将显示附近的 Passport。');
            const candidate = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
            await synchronizeCandidate(candidate, code);
          }
        } else {
          showStatus('working', '正在选择设备', '在 Chrome 列表中选择当前 Passport。');
          const candidate = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }] });
          await synchronizeCandidate(candidate, code);
          chooserRequired = false;
        }
        synchronized = true;
        fileInput.disabled = false;
        installButton.disabled = false;
        connectButton.textContent = '设备已同步';
        showStatus('success', '设备已同步', `已连接 ${device.name || 'Passport'}，可以选择插件。`);
      } catch (error) {
        synchronized = false;
        connectButton.disabled = false;
        connectButton.textContent = '重新同步 Passport';
        showStatus('error', '无法同步设备', error.message);
        if (device?.gatt?.connected) device.gatt.disconnect();
      }
    });

    installButton.addEventListener('click', async () => {
      try {
        if (!synchronized) throw new Error('请先同步设备');
        const file = fileInput.files[0];
        if (!file) throw new Error('请选择 .fpp 文件');
        if (file.size < 108 || file.size > 0x3f000) throw new Error('插件包大小不符合设备限制');
        const packageBytes = new Uint8Array(await file.arrayBuffer());
        installButton.disabled = true;
        progress.hidden = false;
        progress.value = 0;
        showStatus('working', '正在准备设备', `${file.name} · ${file.size} 字节`);

        const begin = new Uint8Array(5);
        begin[0] = 1;
        begin.set(littleEndian(packageBytes.length), 1);
        await writeWithResponse(controlCharacteristic, begin);
        await waitFor(current => current.state === 1, 15000, '暂存区准备');

        const chunkSize = 180;
        let offset = 0;
        let windowCount = 0;
        while (offset < packageBytes.length) {
          const chunk = packageBytes.slice(offset, offset + chunkSize);
          const packet = new Uint8Array(4 + chunk.length);
          packet.set(littleEndian(offset), 0);
          packet.set(chunk, 4);
          await writeWithResponse(dataCharacteristic, packet);
          offset += chunk.length;
          progress.value = offset / packageBytes.length;
          if (++windowCount === 4 || offset === packageBytes.length) {
            await waitFor(current => current.received >= offset, 10000, 'Flash 写入');
            windowCount = 0;
          }
        }
        await writeWithResponse(controlCharacteristic, new Uint8Array([2]));
        await waitFor(current => current.state === 3, 30000, '插件验签');
        showStatus('success', '传输和验签完成', '请核对设备屏幕信息，并在设备上按 OK 安装。');
      } catch (error) {
        showStatus('error', '插件发送失败', error.message);
        installButton.disabled = !synchronized;
      }
    });
  </script>
</body>
</html>
